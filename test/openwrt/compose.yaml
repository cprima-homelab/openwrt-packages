name: openwrt-packages

services:
  test:
    build: .
    volumes:
      - ../../dist/feed:/harness/feed:ro
      - openwrt-image-cache:/cache
    environment:
      OPENWRT_VERSION: "25.12.5"
      OPENWRT_RELEASE: "25.12"
      EXPECTED_PACKAGES: "caddy salt-agent-ubus"
      FEED_BASE_URL: ${FEED_BASE_URL:-}

volumes:
  openwrt-image-cache:
