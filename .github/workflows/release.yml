name: Release packages

on:
  push:
    tags:
      - '*/v*'      # e.g. salt-agent-ubus/v0.3.0-1 or caddy/v2.10.0-1

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: |
          # tag format: <package>/v<version>-<release>
          PKG=$(echo "${{ github.ref_name }}" | cut -d/ -f1)
          VER=$(echo "${{ github.ref_name }}" | cut -d/ -f2 | sed 's/^v//')
          echo "package=$PKG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Build for all targets
        run: |
          echo "Building ${{ steps.tag.outputs.package }} ${{ steps.tag.outputs.version }}"
          # Placeholder — full matrix build triggered here in a real pipeline

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.tag.outputs.package }} ${{ steps.tag.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
